<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardTop1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/><stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
    <linearGradient id="cardTop2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F"/><stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
    <linearGradient id="cardTop3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40916C"/><stop offset="100%" stop-color="#74C69D"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1B4332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="#FFFFFF"/>
  <text x="70" y="42" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B4332">Research Focus</text>
  <line x1="70" y1="56" x2="1130" y2="56" stroke="#D8F3DC" stroke-width="1.5"/>

  <!-- Card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="78" width="330" height="140" rx="14" fill="#FBFDFC" stroke="#E8F5EE"/>
    <rect x="70" y="78" width="330" height="6" rx="3" fill="url(#cardTop1)"/>
  </g>
  <circle cx="98" cy="108" r="4" fill="#52B788">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="115" y="113" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B4332">Emotionally Adaptive AI</text>
  <text x="95" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">Multimodal emotion detection and</text>
  <text x="95" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">persistent-memory AI companions</text>
  <text x="95" y="176" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">for Sinhala &amp; Singlish contexts</text>

  <!-- Card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="435" y="78" width="330" height="140" rx="14" fill="#FBFDFC" stroke="#E8F5EE"/>
    <rect x="435" y="78" width="330" height="6" rx="3" fill="url(#cardTop2)"/>
  </g>
  <circle cx="463" cy="108" r="4" fill="#52B788">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="480" y="113" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B4332">Applied Deep Learning</text>
  <text x="460" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">LSTM-based predictive maintenance</text>
  <text x="460" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">and hybrid deep learning models for</text>
  <text x="460" y="176" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">security vulnerability assessment</text>

  <!-- Card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="800" y="78" width="330" height="140" rx="14" fill="#FBFDFC" stroke="#E8F5EE"/>
    <rect x="800" y="78" width="330" height="6" rx="3" fill="url(#cardTop3)"/>
  </g>
  <circle cx="828" cy="108" r="4" fill="#52B788">
    <animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="845" y="113" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B4332">Grounded LLM Systems</text>
  <text x="825" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">Evidence-constrained generation</text>
  <text x="825" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">for tracking public discourse from</text>
  <text x="825" y="176" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4B5D55">real-time broadcast data</text>
</svg>
